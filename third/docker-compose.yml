services:
  postgres:
    build:
      context: ./postgres
    image: bookstore-postgres:1.0  
    container_name: postgres
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=ru_RU.UTF-8 --auth-host=scram-sha-256"

    volumes:
      - postgres_data:/var/lib/postgresql/

    ports:
      - "5432:5432"
 
  app:
    build:
      context: ./app
    image: bookstore-app:1.0
    container_name: bookstore-app
    restart: always

    env_file:
      - .env
    depends_on:
      - postgres

    volumes:
      - pinger_logs:/app/logs

volumes:
  postgres_data:
  pinger_logs:

